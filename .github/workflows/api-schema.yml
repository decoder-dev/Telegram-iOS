name: Generate and verify API schema
on:
  push:
    paths:
      - 'build-system/SwiftTL/**'
      - '.github/workflows/api-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Generate layer 230
        run: |
          swift run --package-path build-system/SwiftTL SwiftTL build-system/SwiftTL/api-230.tl generated-api --objc-output=generated-api/objc
          test -s generated-api/Api0.swift
          test -n "$(find generated-api/objc -type f -size +0c -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: generated-api-230
          path: generated-api/
          if-no-files-found: error
