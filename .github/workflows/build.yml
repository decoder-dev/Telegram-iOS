# Build unsigned Telegram IPA on GitHub Actions — PrivateMusic-shaped workflow.
#
# Speed model (what you asked for — “not a brand-new full build every time”):
#   1. Do NOT rebuild on every master push. IPA is built only when YOU ask:
#        • Actions → Build unsigned IPA → Run workflow
#        • or push a version tag: git tag vX.Y.Z && git push --tags
#   2. Bazel disk + repository caches are restored between runs, so the 2nd+
#      build mostly recompiles what changed (first cold build is still ~1h).
#   3. Ready IPA stays on the GitHub Release — download that instead of rebuilding.
#
# Telegram still compiles via Make.py/Bazel (not plain xcodebuild like PrivateMusic).
# Optional secrets: TELEGRAM_API_ID / TELEGRAM_API_HASH / TELEGRAM_BUNDLE_ID / TELEGRAM_TEAM_ID

name: Build unsigned IPA

on:
  # No automatic build on every master commit — that was burning ~1h each time.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish / update a GitHub Release with the IPA
        type: boolean
        default: true

concurrency:
  group: telegram-ios-ipa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build IPA (macos-26)
    runs-on: macos-26
    timeout-minutes: 240

    env:
      BUILD_CONFIGURATION: ci_arm64
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_telegram_ios
      BAZEL_CACHE_DIR: ${{ github.workspace }}/.telegram-bazel-cache
      BAZEL_REPO_CACHE: ${{ github.workspace }}/.telegram-bazel-repo-cache

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Fix submodule URLs for forks
        run: |
          git config --file=.gitmodules submodule.submodules/rlottie/rlottie.url \
            https://github.com/TelegramMessenger/rlottie.git
          git config --file=.gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive

      - name: Checkout submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$DEVELOPER_DIR" ]; then
            CANDIDATE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
            [ -n "$CANDIDATE" ] || { echo "::error::No Xcode 26.x found"; exit 1; }
            DEVELOPER_DIR="${CANDIDATE}/Contents/Developer"
            echo "::warning::using $(basename "$CANDIDATE") instead of ${XCODE_VERSION}"
          fi
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          echo "CPUS=$(sysctl -n hw.ncpu)"

      - name: Prepare Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1; then
            echo "metal already available: $(xcrun -f metal)"
          else
            sudo xcodebuild -downloadComponent MetalToolchain
            rm -f "$(getconf DARWIN_USER_TEMP_DIR)/xcrun_db" || true
          fi
          xcrun -f metal
          xcrun metal -v

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /Users/runner/Library/Developer/CoreSimulator/Caches \
            /Library/Developer/CoreSimulator/Profiles/Runtimes/* \
            /Users/runner/.cargo \
            /Users/runner/.rustup \
            /usr/local/lib/android \
            /Users/runner/Library/Android || true
          df -h /

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BAZEL_CACHE_DIR }}
            ${{ env.BAZEL_REPO_CACHE }}
          key: bazel-pm-${{ runner.os }}-${{ env.BUILD_CONFIGURATION }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-pm-${{ runner.os }}-${{ env.BUILD_CONFIGURATION }}-
            bazel-turbo-${{ runner.os }}-${{ env.BUILD_CONFIGURATION }}-
            bazel-turbo-${{ runner.os }}-
            bazel-${{ runner.os }}-

      - name: Write build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BUNDLE_ID: ${{ secrets.TELEGRAM_BUNDLE_ID }}
          TELEGRAM_TEAM_ID: ${{ secrets.TELEGRAM_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          path = "build-system/ci-configuration.json"
          with open("build-system/appstore-configuration.json") as f:
              cfg = json.load(f)
          api_id = os.environ.get("TELEGRAM_API_ID") or ""
          api_hash = os.environ.get("TELEGRAM_API_HASH") or ""
          if api_id and api_hash:
              cfg["api_id"] = api_id
              cfg["api_hash"] = api_hash
          if os.environ.get("TELEGRAM_BUNDLE_ID"):
              cfg["bundle_id"] = os.environ["TELEGRAM_BUNDLE_ID"]
          if os.environ.get("TELEGRAM_TEAM_ID"):
              cfg["team_id"] = os.environ["TELEGRAM_TEAM_ID"]
          with open(path, "w") as f:
              json.dump(cfg, f, indent="\t")
              f.write("\n")
          print(f"api_id={cfg['api_id']} bundle_id={cfg['bundle_id']}")
          PY

      - name: Compute build number
        run: |
          set -euo pipefail
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          BUILD_NUMBER="$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "IPA_NAME=Telegram-${APP_VERSION}-${BUILD_NUMBER}-unsigned.ipa"
          } >> "$GITHUB_ENV"
          echo "Telegram ${APP_VERSION} (${BUILD_NUMBER})"

      - name: Archive unsigned iPhone application
        run: |
          set -euo pipefail
          mkdir -p "$BAZEL_CACHE_DIR" "$BAZEL_REPO_CACHE" artifacts build/artifacts

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          # Make.py + Bazel is Telegram's build system (PrivateMusic uses xcodebuild).
          set -o pipefail
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration="$BUILD_CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" \
            --disableExtensions \
            --skipDsym \
            --ciFast \
            --outputBuildArtifactsPath=build/artifacts \
            2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -40 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Telegram compiler::$safe"
              done

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          chmod +x scripts/package_unsigned_ipa.sh

          # Prefer .app from bazel-bin; fall back to unzipping Make.py IPA.
          APP="$(find -L bazel-bin/Telegram bazel-out -path '*/Telegram.app' -type d 2>/dev/null | head -1 || true)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            RAW_IPA="$(find build/artifacts bazel-bin/Telegram bazel-out -name 'Telegram.ipa' -type f 2>/dev/null | head -1 || true)"
            [ -n "$RAW_IPA" ] || { echo "::error::no Telegram.app / Telegram.ipa"; exit 1; }
            STAGE="$(mktemp -d)"
            unzip -q "$RAW_IPA" -d "$STAGE"
            APP="$(find "$STAGE" -name 'Telegram.app' -type d | head -1)"
            [ -d "$APP" ] || { echo "::error::IPA missing Telegram.app"; exit 1; }
          fi

          bash ./scripts/package_unsigned_ipa.sh \
            "$APP" \
            "$PWD/artifacts/${IPA_NAME}"
          ls -lh "artifacts/${IPA_NAME}"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA="$PWD/artifacts/${IPA_NAME}"
          test -f "$IPA"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${APP_VERSION}-${BUILD_NUMBER}"
          fi
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          Telegram iOS ${APP_VERSION} (${BUILD_NUMBER})

          Unsigned IPA (PrivateMusic-style packaging). Resign before install.

          Build: \`ci_arm64\` via Make.py/Bazel (Telegram cannot use plain xcodebuild).
          Commit: \`${GITHUB_SHA}\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
            gh release edit "$TAG" --title "Telegram ${APP_VERSION} (${BUILD_NUMBER})" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$IPA" \
              --title "Telegram ${APP_VERSION} (${BUILD_NUMBER})" \
              --notes-file "$NOTES"
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: Telegram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-unsigned
          path: artifacts/${{ env.IPA_NAME }}
          if-no-files-found: ignore
          retention-days: 14
