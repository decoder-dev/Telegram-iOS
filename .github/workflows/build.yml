# Build Telegram-iOS (Bazel) on GitHub-hosted macOS runners.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_API_ID    – app api_id from https://my.telegram.org
#   TELEGRAM_API_HASH  – app api_hash from https://my.telegram.org
#
# Optional secrets:
#   TELEGRAM_BUNDLE_ID – defaults to ph.telegra.Telegraph
#   TELEGRAM_TEAM_ID   – Apple Team ID (empty is fine for unsigned/fake-signed IPA)
#
# Manual run: Actions → Build iOS → Run workflow
# Artifacts: Telegram.ipa + Telegram.DSYMs.zip (unsigned / fake-codesigned)

name: Build iOS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: Bazel build configuration
        type: choice
        options:
          - release_arm64
          - debug_arm64
        default: release_arm64
      create_release:
        description: Publish a GitHub Release with the IPA
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ github.event.inputs.configuration || 'release_arm64' }})
    runs-on: macos-26
    timeout-minutes: 480

    env:
      BUILD_CONFIGURATION: ${{ github.event.inputs.configuration || 'release_arm64' }}
      SOURCE_DIR: /Users/Shared/telegram-ios
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_telegram_ios
      BAZEL_CACHE_DIR: /Users/Shared/telegram-bazel-cache

    steps:
      - name: Check API secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Set repository secrets TELEGRAM_API_ID and TELEGRAM_API_HASH (from https://my.telegram.org)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # Relative submodule URLs (../rlottie.git, ../tgcalls.git) resolve under the
      # fork owner and 404. Point them at the upstream TelegramMessenger repos.
      - name: Fix submodule URLs for forks
        run: |
          git config --file=.gitmodules submodule.submodules/rlottie/rlottie.url \
            https://github.com/TelegramMessenger/rlottie.git
          git config --file=.gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive --depth 1 --jobs 8

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Xcode ${XCODE_VERSION} not found. Installed:"
            ls /Applications | grep -i Xcode || true
            # Prefer an exact match; otherwise use the newest installed 26.x.
            CANDIDATE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$CANDIDATE" ]; then
              echo "::error::No Xcode 26.x installation found on the runner."
              exit 1
            fi
            DEVELOPER_DIR="${CANDIDATE}/Contents/Developer"
            echo "::warning::versions.json requests Xcode ${XCODE_VERSION}; using $(basename "$CANDIDATE") instead."
          fi
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          # Drop unused simulator runtimes / large caches that Bazel does not need.
          sudo rm -rf \
            /Users/runner/Library/Developer/CoreSimulator/Caches \
            /Library/Developer/CoreSimulator/Profiles/Runtimes/* \
            /Users/runner/.cargo \
            /Users/runner/.rustup \
            /usr/local/lib/android \
            /Users/runner/Library/Android || true
          df -h /

      - name: Create canonical source directory
        run: |
          set -euo pipefail
          # Source paths are embedded in the binary; keep them stable across CI runs.
          sudo mkdir -p /Users/Shared
          sudo rm -rf "$SOURCE_DIR"
          sudo cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"
          sudo chown -R "$(whoami)" "$SOURCE_DIR"

      - name: Write build configuration from secrets
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BUNDLE_ID: ${{ secrets.TELEGRAM_BUNDLE_ID }}
          TELEGRAM_TEAM_ID: ${{ secrets.TELEGRAM_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          cfg = {
              "bundle_id": os.environ.get("TELEGRAM_BUNDLE_ID") or "ph.telegra.Telegraph",
              "api_id": os.environ["TELEGRAM_API_ID"],
              "api_hash": os.environ["TELEGRAM_API_HASH"],
              "team_id": os.environ.get("TELEGRAM_TEAM_ID") or "",
              "app_center_id": "0",
              "is_internal_build": "false",
              "is_appstore_build": "true",
              "appstore_id": "686449807",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "org.telegram.telegramPremium.monthly",
              "enable_siri": True,
              "enable_icloud": True,
          }
          path = "build-system/ci-configuration.json"
          with open(path, "w") as f:
              json.dump(cfg, f, indent="\t")
              f.write("\n")
          print(f"Wrote {path} (api_id={cfg['api_id']}, bundle_id={cfg['bundle_id']})")
          PY

      - name: Compute build number
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"
          echo "Telegram ${APP_VERSION} (${BUILD_NUMBER})"

      - name: Build IPA
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$BAZEL_CACHE_DIR"

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration="$BUILD_CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect artifacts
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          IPA="$(find -L bazel-out -path '*/Telegram/Telegram.ipa' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$IPA" ]; then
            echo "::error::Telegram.ipa not found under bazel-out"
            find -L bazel-out -name '*.ipa' 2>/dev/null | head -50 || true
            exit 1
          fi
          cp "$IPA" "$OUTPUT_PATH/Telegram.ipa"
          echo "IPA=$IPA"

          mkdir -p build/DSYMs
          while IFS= read -r dsym; do
            cp -R "$dsym" build/DSYMs/
          done < <(find -L bazel-out -path '*/Telegram/*.dSYM' -type d 2>/dev/null || true)
          if [ -n "$(ls -A build/DSYMs 2>/dev/null || true)" ]; then
            zip -r "$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs >/dev/null
          else
            echo "::warning::No dSYM bundles found"
          fi

          ls -lh "$OUTPUT_PATH"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.ipa
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned (fake-codesigned) Telegram iOS build **${{ env.APP_VERSION }}** (${{ env.BUILD_NUMBER }}).
            Configuration: `${{ env.BUILD_CONFIGURATION }}`.
            Commit: `${{ github.sha }}`.
          files: |
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.ipa
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.DSYMs.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
