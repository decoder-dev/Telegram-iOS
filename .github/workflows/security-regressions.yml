name: Security regression tests
on:
  pull_request:
    branches: [master]
    paths:
      - 'Tests/CodeScanning/**'
      - 'third-party/**'
      - 'Telegram/WatchApp/Packages/**'
      - 'submodules/CompanionRenderer/**'
      - 'submodules/ffmpeg/**'
      - 'submodules/TelegramUI/Components/RichTextEditor/Host/Engine/Scripts/ime_keyboard_contract.py'
      - 'submodules/TelegramUI/Components/RichTextEditor/Host/Engine/Scripts/tests/test_ime_keyboard_contract.py'
      - '.github/workflows/security-regressions.yml'
  push:
    branches: [master]
    paths:
      - 'Tests/CodeScanning/**'
      - 'third-party/**'
      - 'Telegram/WatchApp/Packages/**'
      - 'submodules/CompanionRenderer/**'
      - 'submodules/ffmpeg/**'
      - 'submodules/TelegramUI/Components/RichTextEditor/Host/Engine/Scripts/ime_keyboard_contract.py'
      - 'submodules/TelegramUI/Components/RichTextEditor/Host/Engine/Scripts/tests/test_ime_keyboard_contract.py'
      - '.github/workflows/security-regressions.yml'
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Escaped and adversarial keyboard defaults
        working-directory: submodules/TelegramUI/Components/RichTextEditor/Host/Engine/Scripts/tests
        run: >-
          python3 -m unittest
          test_ime_keyboard_contract.IMEKeyboardContractTests.test_defaults_inventory_parser_rejects_malformed_output
          test_ime_keyboard_contract.IMEKeyboardContractTests.test_defaults_inventory_parser_handles_escapes_and_rejects_long_invalid_strings
  codecs:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native codec test dependencies
        run: |
          if ! pkg-config --exists libavcodec libavformat libavutil libswscale; then
            brew install pkg-config ffmpeg
          fi
      - name: OpenH264 and Subcodec round-trip regression suites
        run: python3 Tests/CodeScanning/native_regressions.py
  watch-codecs:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [OpusKit, WebPKit, RLottieKit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package codec regression tests
        run: swift test --package-path Telegram/WatchApp/Packages/${{ matrix.package }}
