name: Client regression tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'submodules/TelegramVLESS/**'
      - 'submodules/WebProxyTransport/Sources/WebProxyManager.swift'
      - 'submodules/TelegramCore/Sources/Network/ProxyServersStatuses.swift'
      - 'submodules/TelegramCore/Sources/Network/NetworkFrameworkTcpConnectionInterface.swift'
      - 'submodules/TelegramCore/Sources/Network/MTWebSocketConnectionInterface.swift'
      - 'submodules/TelegramCore/Sources/Network/FetchV2.swift'
      - 'submodules/TelegramCore/Sources/State/**'
      - 'submodules/TelegramCore/Sources/Settings/ProxySettings.swift'
      - 'submodules/TelegramCore/Sources/Account/AccountManager.swift'
      - 'submodules/TelegramPresentationData/Sources/PresentationData.swift'
      - 'Tests/ManagedProxy/**'
      - 'Tests/GhostMode/**'
      - 'Tests/ClientAdditions/**'
      - 'Tests/ChatListSync/**'
      - 'Tests/Customization/**'
      - 'Tests/Branding/**'
      - 'tools/branding/**'
      - 'assets/branding/**'
      - 'Telegram/Telegram-iOS/Telegram.icon/**'
      - 'Tests/MenuPresentation/**'
      - 'Tests/ArchiveLock/**'
      - 'Tests/MessageSaving/**'
      - 'Tests/Camera/**'
      - 'Tests/StreamingDrafts/**'
      - 'submodules/Postbox/Sources/Postbox.swift'
      - 'Tests/ApiLayer/**'
      - 'submodules/TelegramApi/**'
      - 'submodules/TelegramCore/Sources/ApiUtils/**'
      - 'submodules/TelegramUI/Components/ChatScheduleTimeController/**'
      - 'submodules/TelegramUI/Components/ChatTimerScreen/**'
      - 'Tests/UISizing/**'
      - 'submodules/TelegramUIPreferences/Sources/MessageSavingStore.swift'
      - 'submodules/TelegramUIPreferences/Sources/ForkPresentationLanguage.swift'
      - 'submodules/ChatListUI/Sources/ArchiveLockHelpers.swift'
      - 'submodules/TelegramUIPreferences/Sources/ArchivePasswordKeychain.swift'
      - 'submodules/SettingsUI/Sources/**'
      - 'submodules/ChatListUI/Sources/ArchiveLockLocalizedString.swift'
      - 'submodules/ItemListUI/Sources/Items/ItemListMultilineInputItem.swift'
      - 'Tests/NetworkPolicies/**'
      - 'Tests/NetworkRecovery/**'
      - '.github/workflows/client-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Telegram 13 migration and fork compatibility
        run: |
          python3 Tests/Upstream13/parse.py
          python3 Tests/Upstream13/migration.py
          python3 Tests/Upstream13/own_features.py
          python3 Tests/Upstream13/audio_rich_text.py
          python3 Tests/Upstream13/sticker_settings.py
          python3 Tests/Upstream13/queued_reads.py
          python3 Tests/Customization/greeting_live.py
          python3 Tests/Upstream13/passcode.py
          python3 Tests/Upstream13/passcode_codec.py
          python3 Tests/Upstream13/proxy_switching.py
          python3 Tests/Upstream13/web_codecs.py
          python3 Tests/Upstream13/siri_objc_names.py
      - run: swift test --package-path submodules/TelegramVLESS
        if: ${{ !cancelled() }}
      - run: python3 Tests/ManagedProxy/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ManagedProxy/bootstrap.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ManagedProxy/automatic.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/Customization/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ClientAdditions/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ClientAdditions/quality.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ClientAdditions/menu_layout.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ChatListSync/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/Customization/theme_selection.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/Customization/shadow_ban.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/Customization/appearance.py
        if: ${{ !cancelled() }}
      - run: python3 -m unittest discover -s Tests/Branding
        if: ${{ !cancelled() }}
      - run: python3 Tests/GhostMode/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/Camera/native_zoom.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/MenuPresentation/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/MessageSaving/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/Camera/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/StreamingDrafts/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ApiLayer/run.py
        if: ${{ !cancelled() }}
      - run: python3 -m unittest discover -s Tests/UISizing
        if: ${{ !cancelled() }}
      - run: python3 Tests/ArchiveLock/password_flow.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ArchiveLock/theme_lifetime.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ArchiveLock/migration.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/ArchiveLock/wiring.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/NetworkPolicies/run.py
        if: ${{ !cancelled() }}
      - run: python3 Tests/NetworkRecovery/run.py
        if: ${{ !cancelled() }}
